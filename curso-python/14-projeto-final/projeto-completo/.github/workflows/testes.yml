name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar o projeto e as ferramentas
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes (pytest)
        run: python -m pytest
      - name: Série de exemplo em modo ensaio
        run: validador --planilha dados/planilha_valores.xlsx --regras dados/regras.db --emails dados/emails --saida saida
