<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Simulador de treino - Emissão de Certificado</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 24px; background: #f4f6f8; color: #1d2731; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .aviso { background: #fff3cd; border: 1px solid #e0c36a; padding: 6px 10px; display: inline-block; }
  form { background: #fff; border: 1px solid #c9d3dc; padding: 16px; margin-top: 16px; max-width: 520px; }
  .campo { display: flex; flex-direction: column; margin-bottom: 10px; }
  label { font-weight: 600; margin-bottom: 3px; }
  input, select, textarea { padding: 6px; border: 1px solid #9aa9b7; font-size: 1rem; }
  .botoes { display: flex; gap: 8px; margin-top: 12px; }
  button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
  #confirmar { background: #1f4e78; color: #fff; border: none; }
  #carregando { margin-top: 12px; font-style: italic; }
  #mensagem { margin-top: 12px; min-height: 1.4em; font-weight: 600; }
  .erro { color: #9c0006; }
  table { border-collapse: collapse; margin-top: 16px; background: #fff; }
  th, td { border: 1px solid #c9d3dc; padding: 4px 10px; }
</style>
</head>
<body>
<h1>Emissão de Certificado de Qualidade</h1>
<p class="aviso">Página de TREINO do módulo 12. Ela imita uma tela de ERP, mas não é o sistema real.</p>

<form id="form-certificado" autocomplete="off">
  <div class="campo"><label for="op">OP</label><input id="op" name="op" maxlength="6"></div>
  <div class="campo"><label for="nf">NF</label><input id="nf" name="nf"></div>
  <div class="campo"><label for="peso">Peso (kg)</label><input id="peso" name="peso"></div>
  <div class="campo">
    <label for="linha">Linha</label>
    <select id="linha" name="linha">
      <option value="">Selecione</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
    </select>
  </div>
  <div class="campo"><label for="obs">Observação</label><textarea id="obs" name="obs" rows="2"></textarea></div>
  <div class="botoes">
    <button type="button" id="confirmar">Confirmar</button>
    <button type="button" id="cancelar">Cancelar</button>
  </div>
</form>

<div id="carregando" hidden>Processando, aguarde...</div>
<div id="mensagem" role="status"></div>

<table aria-label="Certificados emitidos">
  <thead><tr><th>Certificado</th><th>OP</th><th>NF</th><th>Peso (kg)</th></tr></thead>
  <tbody id="emitidos"></tbody>
</table>

<script>
  // Simula um sistema lento: a resposta demora um pouco, como num ERP de verdade.
  let proximo = 1;
  const campo = (id) => document.getElementById(id);
  const mensagem = campo("mensagem");

  function mostrar(texto, erro) {
    mensagem.textContent = texto;
    mensagem.className = erro ? "erro" : "";
  }

  campo("cancelar").addEventListener("click", () => {
    campo("form-certificado").reset();
    mostrar("Operação cancelada", false);
  });

  campo("confirmar").addEventListener("click", () => {
    const op = campo("op").value.trim();
    const nf = campo("nf").value.trim();
    const peso = campo("peso").value.trim();
    const linha = campo("linha").value;
    if (!/^\d{6}$/.test(op)) { mostrar("Erro: a OP deve ter 6 dígitos", true); return; }
    if (!/^\d+$/.test(nf)) { mostrar("Erro: NF inválida", true); return; }
    if (!/^[\d.]+,\d{2}$/.test(peso)) { mostrar("Erro: peso no formato 1.250,50", true); return; }
    if (!linha) { mostrar("Erro: selecione a linha", true); return; }
    mostrar("", false);
    campo("carregando").hidden = false;
    setTimeout(() => {
      campo("carregando").hidden = true;
      const numero = String(proximo++).padStart(6, "0");
      const tr = document.createElement("tr");
      for (const valor of [numero, op, nf, peso]) {
        const td = document.createElement("td");
        td.textContent = valor;
        tr.appendChild(td);
      }
      campo("emitidos").appendChild(tr);
      campo("form-certificado").reset();
      mostrar("Certificado " + numero + " gerado para a OP " + op, false);
    }, 1200);
  });
</script>
</body>
</html>
